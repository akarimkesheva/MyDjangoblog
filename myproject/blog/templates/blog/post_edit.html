{% extends 'blog/base.html' %}

{% block content %}
    <h2 style="font-family: 'Lobster', cursive;">New Post</h2>
    <form method="POST" class="post-form">{% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="save btn btn-default" style="background-color: #ff9421; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Save</button>
    </form>
{% endblock %}
